id: P02
title: IBD segment detection
taxonomy_class: "A"          # find things efficiently
status: implemented

formal_spec:
  statement: >
    Among N haplotypes over M biallelic sites with physical positions, find all
    pairs (i, j) and intervals [left, right) that are identical by descent, and
    report the segment boundaries. Naively O(N^2) pairs, each requiring a scan.
  api: "call_ibd(panel, pos, params) -> list of (i, j, left_bp, right_bp)"

truth_source:
  kind: EXACT
  detail: >
    tskit 0.5.7 ibd_segments(max_time=T, min_span=S) returns, for every pair,
    the maximal intervals whose MRCA is a single node at time <= T inherited
    along one unbroken genealogical path. Exact by construction from the
    simulated ancestry; no curated answer key exists to be memorized.
  THE_LOAD_BEARING_CAVEAT: >
    Genealogical IBD is NOT the same as detectable IBD. tskit's definition is
    purely genealogical and ignores allelic state entirely; IBD callers detect
    long identical-by-state stretches. A caller can be "wrong" against
    genealogical truth while being right about what practitioners want. Two
    consequences, both handled explicitly: (1) max_time is mandatory -- without
    it every pair is IBD everywhere, since all haplotypes share some ancestor;
    (2) measured recall against genealogical truth is LOW even for a correct
    caller (our incumbent scores 0.33), so the arena scores RELATIVE to the
    incumbent and never treats absolute recall as a quality claim.
  max_time_generations: 100
  min_segment_cm: 2.0

instances:
  generator: "msprime 1.3.1 + tskit 0.5.7, fresh seed per run"
  demography: >
    Recent exponential growth (N_now=500,000, r=0.05) over an ancestral
    N=10,000 before 200 generations. This choice is deliberate and documented:
    manufacturing IBD density by shrinking Ne to 1,000 yields ~10x more
    segments but distorts the haplotype structure the algorithm must exploit,
    so a method tuned there would not transfer. Recent growth is the mechanism
    that actually produces abundant IBD in real cohorts. The price is needing a
    larger panel for the same number of truth segments.
  tiers:
    tiny:   {n_hap: 60,     seq_len_bp: 5.0e6}
    small:  {n_hap: 600,    seq_len_bp: 2.0e7, measured: "43,521 sites, 251 true segments, 772 cM"}
    medium: {n_hap: 2000,   seq_len_bp: 5.0e7}
    large:  {n_hap: 10000,  seq_len_bp: 1.0e8}

metrics:
  primary: [cm_recall, cm_precision]
  rationale: >
    cM-level overlap per pair is the primary metric because it is robust to
    FRAGMENTATION: a true 10 cM segment reported as two 4 cM pieces costs a
    little precision instead of silently scoring as a total miss, which is what
    segment-level power alone would do.
  secondary: [seg_power_ro0.5, seg_power_ro0.8, median_length_error_cm]
  cost_axes: [wall_s, peak_rss_bytes]
  counters: [probes, compares]
  degenerate_optimum_guard: >
    Calling nothing maximises precision; calling everything maximises recall.
    The gate requires BOTH above a floor and the score is always reported as a
    pair, never collapsed to one number.

incumbent:
  name: "seed-and-extend (the hap-IBD design), built on P01's PBWT"
  implementation: baseline_hapibd.py
  measured_small_tier:
    instance: "600 haplotypes x 43,521 sites, seed 42"
    wall_s: 65.1
    cm_recall: 0.332
    cm_precision: 0.791
    n_calls: 100
    n_true: 251
    median_length_error_cm: -0.163

mutable_surface:
  - "STAGE 1 seed: all-pairs exact maximal match discovery (THIS IS P01)"
  - "STAGE 2 filter: seed length threshold and its units"
  - "STAGE 3 extend: gap tolerance and discordance budget when merging seeds"
  - "STAGE 4 report: final length threshold and boundary refinement"

measured_coupling:
  instance: "600 haplotypes x 43,521 sites, min of 3 runs"
  stage1_seeding_s: 68.423
  stages234_s: 0.012
  stage1_share: 0.9998
  amdahl: "2x on the index -> 2.00x on P02; 5x -> 5.00x; 10x -> 9.98x"

coupling_to_P01: >
  Stage 1 dominates the cost and is literally P01's problem: panel_matches.py
  imports P01's PBWT column update by explicit path. An agent that improves the
  P01 index improves P02 without touching P02's logic. This makes the
  "one breakthrough wins multiple benchmarks" claim a MEASURED dependency
  rather than an assertion -- and it is the reason these two are paired.

gameability_risks:
  - "Emit one genome-long call per pair: maximises recall, destroyed by the precision floor."
  - "Emit only ultra-confident short calls: maximises precision, destroyed by the recall floor."
  - "Tune thresholds to the fixed instance: fresh seeds per evaluation run."
  - "Reimplement hap-IBD or RaPID and present it as novel: novelty gate before any claim."
